<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>启动本地服务</title>
  <style>
    :root {
      --base: #0B0C0E;
      --edge: #2A2E34;
      --ink: #EDE8DE;
      --dim: #9A958C;
      --faint: #6B675F;
      --accent: #8FE388;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--base);
      color: var(--ink);
      font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .frame {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 18px;
      border: 1px solid var(--edge);
      border-radius: 10px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(32, 53, 31, 0.45), transparent 70%),
        var(--base);
    }
    header {
      display: flex; align-items: center; gap: 9px;
      -webkit-app-region: drag;
    }
    .mark {
      width: 24px; height: 24px; display: grid; place-items: center;
      border: 1px solid rgba(143, 227, 136, 0.4);
      border-radius: 4px;
      background: rgba(32, 53, 31, 0.45);
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px; font-weight: 600;
    }
    .wordmark {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    }
    .close {
      margin-left: auto;
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border: none; border-radius: 5px;
      background: transparent; color: var(--faint);
      font-size: 15px; cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .close:hover { background: #1A1D21; color: var(--ink); }
    .close:focus-visible { outline: 2px solid rgba(143, 227, 136, 0.6); }

    .body {
      flex: 1;
      display: flex; flex-direction: column; justify-content: center;
      padding: 8px 4px 0;
    }
    .signal {
      display: flex; align-items: flex-end; gap: 5px; height: 26px;
      margin-bottom: 16px;
    }
    .signal span {
      width: 3px; height: 8px; border-radius: 1px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(143, 227, 136, 0.35);
      animation: signal 1.1s ease-in-out infinite;
    }
    .signal span:nth-child(1) { animation-delay: 0s; }
    .signal span:nth-child(2) { animation-delay: 0.12s; }
    .signal span:nth-child(3) { animation-delay: 0.24s; }
    .signal span:nth-child(4) { animation-delay: 0.36s; }
    .signal span:nth-child(5) { animation-delay: 0.48s; }
    @keyframes signal {
      0%, 100% { height: 8px; opacity: 0.45; }
      50% { height: 26px; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal span { animation: none; height: 14px; opacity: 0.8; }
    }

    h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .detail {
      margin: 6px 0 0; min-height: 34px;
      color: var(--dim); font-size: 12px;
    }
    footer {
      margin-top: 12px;
      display: flex; align-items: center; gap: 8px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px; letter-spacing: 0.1em; color: var(--faint);
    }
    footer::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: rgba(143, 227, 136, 0.75); }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="mark">N</div>
      <span class="wordmark">Nova Agent</span>
      <button class="close" id="close" type="button" aria-label="取消启动">×</button>
    </header>

    <div class="body" role="status" aria-live="polite">
      <div class="signal" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h1 id="message">正在启动本地服务…</h1>
      <p class="detail" id="detail">首次启动需要初始化本地数据库，可能需要几十秒。</p>
    </div>

    <footer>127.0.0.1 · 无遥测</footer>
  </div>

  <script>
    const messageEl = document.getElementById('message')
    const detailEl = document.getElementById('detail')

    window.novaDesktop.onLaunchStatus((payload) => {
      if (!payload) return
      if (payload.message) messageEl.textContent = payload.message
      if (typeof payload.detail === 'string') detailEl.textContent = payload.detail
    })

    document.getElementById('close').addEventListener('click', () => window.close())
  </script>
</body>
</html>
