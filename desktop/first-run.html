<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>运行 Nova Agent</title>
  <style>
    :root {
      --base: #0B0C0E;
      --panel: #121417;
      --raised: #1A1D21;
      --edge: #2A2E34;
      --ink: #EDE8DE;
      --dim: #9A958C;
      --faint: #6B675F;
      --accent: #8FE388;
      --accent-soft: #20351F;
      --err: #E06C62;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--base);
      color: var(--ink);
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
    }
    .frame {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 26px 30px 22px;
      background-image:
        linear-gradient(to right, rgba(237, 232, 222, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(237, 232, 222, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center top;
      background-repeat: repeat;
    }
    header { display: flex; align-items: center; gap: 10px; }
    .mark {
      width: 28px; height: 28px; display: grid; place-items: center;
      border: 1px solid rgba(143, 227, 136, 0.4);
      border-radius: 4px;
      background: rgba(32, 53, 31, 0.45);
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 14px; font-weight: 600;
    }
    .wordmark {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink);
    }
    .version {
      margin-left: auto;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px; letter-spacing: 0.14em;
      color: var(--faint);
    }
    .eyebrow {
      margin: 26px 0 0;
      display: flex; align-items: center; gap: 8px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim);
    }
    .eyebrow::before {
      content: ""; width: 24px; height: 1px; background: rgba(143, 227, 136, 0.6);
    }
    h1 {
      margin: 10px 0 0;
      font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em;
    }
    .lede { margin: 6px 0 0; color: var(--dim); font-size: 13px; }
    .modes { display: grid; gap: 12px; margin-top: 22px; }

    .mode {
      border: 1px solid var(--edge);
      border-radius: 10px;
      background: rgba(18, 20, 23, 0.85);
      padding: 16px 18px;
    }
    .mode.local {
      border-color: rgba(143, 227, 136, 0.32);
      background: linear-gradient(180deg, rgba(32, 53, 31, 0.35), rgba(18, 20, 23, 0.9) 60%);
    }
    .mode-head { display: flex; align-items: center; gap: 9px; }
    .mode-head svg { color: var(--accent); flex: none; }
    .mode-title { font-size: 15px; font-weight: 600; }
    .badge {
      margin-left: auto;
      padding: 2px 7px;
      border: 1px solid rgba(143, 227, 136, 0.35);
      border-radius: 999px;
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .mode-text { margin: 7px 0 0; color: var(--dim); font-size: 12.5px; }
    .points {
      margin: 10px 0 0; padding: 0; list-style: none;
      display: grid; gap: 5px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px; color: var(--dim);
    }
    .points li { display: flex; gap: 8px; }
    .points li::before { content: "─"; color: var(--accent); flex: none; }
    .danger { color: #D9A45B; }

    .field { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1; min-width: 0;
      padding: 9px 11px;
      border: 1px solid var(--edge); border-radius: 7px;
      background: #0E1013; color: var(--ink);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px; outline: none;
    }
    input::placeholder { color: var(--faint); }
    input:focus { border-color: rgba(143, 227, 136, 0.5); }

    button {
      border: none; border-radius: 7px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
    }
    button:focus-visible { outline: 2px solid rgba(143, 227, 136, 0.6); outline-offset: 2px; }
    button:disabled { opacity: 0.55; cursor: default; }
    .primary {
      width: 100%; margin-top: 14px; padding: 10px 14px;
      background: var(--accent); color: #0B0C0E;
    }
    .primary:hover:not(:disabled) { background: #A4EC9D; }
    .secondary {
      flex: none; padding: 9px 16px;
      background: transparent; color: var(--ink);
      border: 1px solid var(--edge);
    }
    .secondary:hover:not(:disabled) { border-color: rgba(143, 227, 136, 0.45); color: var(--accent); }

    .error {
      display: none;
      margin-top: 14px; padding: 9px 12px;
      border: 1px solid rgba(224, 108, 98, 0.45);
      border-radius: 7px;
      background: rgba(58, 29, 27, 0.55);
      color: #F0A39C; font-size: 12px; white-space: pre-wrap;
    }
    .error.show { display: block; }
    footer {
      margin-top: auto; padding-top: 18px;
      border-top: 1px solid rgba(42, 46, 52, 0.7);
      display: flex; gap: 12px; align-items: baseline;
      font-size: 11px; color: var(--faint);
    }
    footer .mono { font-size: 10px; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="mark">N</div>
      <span class="wordmark">Nova Agent</span>
      <span class="version">desktop</span>
    </header>

    <p class="eyebrow">run mode</p>
    <h1>先决定 Nova 在哪里运行。</h1>
    <p class="lede">两种方式共用同一套工具、证据与审批。之后可以在菜单「运行」里切换。</p>

    <div class="modes">
      <section class="mode local" aria-labelledby="local-title">
        <div class="mode-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span class="mode-title" id="local-title">在本机运行</span>
          <span class="badge">推荐</span>
        </div>
        <p class="mode-text">安装包内置完整后端与 PostgreSQL，不需要另找服务器，数据保存在这台电脑。</p>
        <ul class="points">
          <li>开箱即用，不依赖网络</li>
          <li>项目、会话与密钥都在本机</li>
          <li class="danger">命令直接在本机执行，没有容器隔离</li>
        </ul>
        <button id="local" class="primary" type="button">在本机启动</button>
      </section>

      <section class="mode" aria-labelledby="server-title">
        <div class="mode-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="8" rx="2"></rect><rect x="2" y="14" width="20" height="8" rx="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
          <span class="mode-title" id="server-title">连接服务器</span>
        </div>
        <p class="mode-text">连接一台已经部署好的 Nova 实例，本机只做界面，执行与数据都在服务器上。</p>
        <div class="field">
          <input id="server" placeholder="http://192.168.1.10:8000" spellcheck="false" autocomplete="off" aria-label="服务器地址" />
          <button id="connect" class="secondary" type="button">连接</button>
        </div>
      </section>
    </div>

    <div id="error" class="error" role="alert" aria-live="polite"></div>

    <footer>
      <span class="mono">NO TELEMETRY</span>
      <span>本机运行同样不发送任何遥测；首次启动会初始化本地数据库，需要几十秒。</span>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    let saved = { savedUrl: '', warning: '' }
    try { saved = JSON.parse(decodeURIComponent(params.get('config') || '{}')) } catch {}

    const localButton = document.getElementById('local')
    const connectButton = document.getElementById('connect')
    const input = document.getElementById('server')
    const errorBox = document.getElementById('error')

    if (saved.savedUrl) input.value = saved.savedUrl
    if (saved.warning) showError(saved.warning)

    function showError(message) {
      errorBox.textContent = message
      errorBox.classList.add('show')
    }

    function clearError() {
      errorBox.textContent = ''
      errorBox.classList.remove('show')
    }

    function setBusy(busy, label) {
      localButton.disabled = busy
      connectButton.disabled = busy
      input.disabled = busy
      if (busy && label) {
        localButton.dataset.idle = localButton.textContent
        localButton.textContent = label
      } else if (!busy && localButton.dataset.idle) {
        localButton.textContent = localButton.dataset.idle
      }
    }

    async function startLocal() {
      clearError()
      setBusy(true, '正在启动本地服务…')
      try {
        const result = await window.novaDesktop.startLocal()
        if (result && result.ok) return // 启动窗口接管，主窗口打开后本窗口关闭
        showError((result && result.error) || '本地服务启动失败')
      } catch (err) {
        showError('本地服务启动失败：' + (err && err.message ? err.message : '未知错误'))
      } finally {
        setBusy(false)
      }
    }

    async function connect() {
      clearError()
      const value = input.value.trim()
      if (!value) {
        showError('请先填写服务器地址，例如 http://192.168.1.10:8000')
        input.focus()
        return
      }
      setBusy(true)
      connectButton.textContent = '连接中…'
      try {
        const result = await window.novaDesktop.connect(value)
        if (result && result.ok) return
        showError((result && result.error) || '连接失败')
      } catch (err) {
        showError('连接失败：' + (err && err.message ? err.message : '未知错误'))
      } finally {
        setBusy(false)
        connectButton.textContent = '连接'
      }
    }

    localButton.addEventListener('click', () => void startLocal())
    connectButton.addEventListener('click', () => void connect())
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') void connect()
    })
  </script>
</body>
</html>
