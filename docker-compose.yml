name: nova-agent

# 一键部署：cp .env.docker.example .env → 填 Key/密码 → docker compose up -d --build
# 组件：app(FastAPI+前端静态) + postgres + qdrant + sandbox 镜像构建
# 可选 HTTPS：准备域名后 cp Caddyfile.example Caddyfile，改域名，再 `docker compose --profile https up -d`

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nova_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nova_agent}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 构建沙箱镜像后立即退出；app 通过挂载的 docker.sock 启动一次性沙箱容器
  sandbox-image:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    image: nova-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  # 验证镜像：预装 fastapi/pytest 等，用于真实跑仓库测试
  builder-image:
    build:
      context: ./backend
      dockerfile: Dockerfile.builder
    image: nova-builder:latest
    entrypoint: ["true"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: prod
      AUTO_INIT_DB: "true"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nova_agent}

      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

      LLM_MODEL_PRIORITY: ${LLM_MODEL_PRIORITY:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.8-max}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LONGCAT_API_KEY: ${LONGCAT_API_KEY:-}
      LONGCAT_BASE_URL: ${LONGCAT_BASE_URL:-https://api.longcat.chat/openai/v1}
      LONGCAT_MODEL: ${LONGCAT_MODEL:-LongCat-2.0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      ADMIN_HOURLY_MESSAGES: ${ADMIN_HOURLY_MESSAGES:-60}
      DEMO_HOURLY_MESSAGES: ${DEMO_HOURLY_MESSAGES:-10}
      ADMIN_DAILY_TOKENS: ${ADMIN_DAILY_TOKENS:-0}
      DEMO_DAILY_TOKENS: ${DEMO_DAILY_TOKENS:-100000}
      ADMIN_SANDBOX_DAILY: ${ADMIN_SANDBOX_DAILY:-0}
      DEMO_SANDBOX_DAILY: ${DEMO_SANDBOX_DAILY:-20}
      ADMIN_JOB_HOURLY: ${ADMIN_JOB_HOURLY:-30}
      DEMO_JOB_HOURLY: ${DEMO_JOB_HOURLY:-5}

      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_IMAGE: nova-sandbox:latest
      SANDBOX_BUILDER_IMAGE: nova-builder:latest
      SANDBOX_ALLOW_NETWORK: ${SANDBOX_ALLOW_NETWORK:-false}
      ENABLE_FETCH_URL: ${ENABLE_FETCH_URL:-true}

      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 沙箱依赖宿主 docker：app 只创建受限的一次性容器（无网络/只读/丢权限）
      - /var/run/docker.sock:/var/run/docker.sock
      - repos_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
      builder-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # 可选：自动 HTTPS（需要域名解析到本机）
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  repos_data:
  caddy_data:
  caddy_config: