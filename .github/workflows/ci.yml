name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install lint tooling
        run: pip install ruff==0.17.3

      - name: Lint backend
        run: cd backend && python -m ruff check app tests scripts evals

      - name: Backend tests
        env:
          NOVA_TEST_FAST: "1"
        run: cd backend && python -m pytest tests -q

      - name: Validate thesis templates
        run: cd backend && python -m scripts.validate_thesis_templates

      - name: Agent eval smoke (scripted, baseline gate)
        run: cd backend && python -m evals run --mode scripted --ci --baseline evals/baselines/scripted.json

      - name: OpenAPI contract check
        run: cd backend && python -m scripts.export_openapi --check

      - name: Frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend build
        run: cd frontend && npm run build

      - name: Contract drift check
        run: cd frontend && npm run contract:check

  security:
    # Advisory for now: it reports known vulnerabilities without blocking PRs
    # until the current findings are triaged. Promote to blocking afterwards.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (high and above)
        run: cd frontend && npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations on an empty database (twice)
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio

          from app.db import query
          from app.db.init_db import LATEST_SCHEMA_VERSION, init_postgres

          REQUIRED_CONSTRAINTS = {
              "sessions_product_mode_check",
              "thesis_documents_status_check",
              "thesis_issues_severity_check",
              "thesis_issues_status_check",
          }

          async def main() -> None:
              await init_postgres()
              # Startup may race a previous partial run; the second call must
              # be a no-op and must not fail on existing indexes/constraints.
              await init_postgres()

              rows = await query("SELECT max(version) FROM schema_migrations")
              current = int(rows[0][0] or 0)
              assert current == LATEST_SCHEMA_VERSION, (current, LATEST_SCHEMA_VERSION)

              rows = await query(
                  "SELECT conname FROM pg_constraint WHERE conname = ANY(%s)",
                  (list(REQUIRED_CONSTRAINTS),),
              )
              found = {row[0] for row in rows}
              assert found == REQUIRED_CONSTRAINTS, found
              print(f"schema v{current} ok; {len(found)} constraints present")

          asyncio.run(main())
          PY

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sandbox image
        run: docker build -f backend/Dockerfile.sandbox -t nova-sandbox:ci backend

      - name: Toolchain present
        run: |
          docker run --rm nova-sandbox:ci git --version
          docker run --rm nova-sandbox:ci python -c "import pytest, numpy; print('deps ok')"

      - name: Runtime isolation
        run: |
          test "$(docker run --rm nova-sandbox:ci id -u)" != "0"
          if docker run --rm --read-only --tmpfs /tmp:rw nova-sandbox:ci touch /probe; then
            echo "root filesystem is writable" >&2; exit 1
          fi
          if docker run --rm --network none nova-sandbox:ci python -c \
            "import socket; socket.create_connection(('1.1.1.1', 53), 2)"; then
            echo "network is reachable" >&2; exit 1
          fi

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: backend/Dockerfile
          - name: sandbox
            context: backend
            file: backend/Dockerfile.sandbox
          - name: builder
            context: backend
            file: backend/Dockerfile.builder
          - name: node
            context: backend
            file: backend/Dockerfile.node-builder
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
