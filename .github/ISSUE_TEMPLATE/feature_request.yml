name: Feature request
description: 提出一个功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不是直接指定实现方式。论文模式明确不做代写、降重、降低 AIGC 检测率、伪造引用和论文买卖。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 可以描述交互、输出或规则，不必是最终方案。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 论文模式 / 格式检查
        - 论文模式 / 引用核验
        - 论文模式 / AI 使用声明
        - 论文模式 / 报告与导出
        - 论文模式 / 学校模板
        - 开发模式
        - 开源分发 / 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
  - type: checkboxes
    id: integrity
    attributes:
      label: 学术诚信确认
      options:
        - label: 这个建议不涉及代写、降重、降低 AIGC 检测率、伪造引用或论文买卖
          required: true
